[package]
name = "qodi-server"
version = "0.1.0"
edition = "2024"
description = "Self-hosted music streaming server for Qodi Music"
license = "MIT"
repository = "https://github.com/cbranty/qodi-music"
publish = false

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures-util = "0.3.34"
getrandom = { version = "0.4.3", features = ["sys_rng"] }
hex = "0.4.3"
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto"] }
lofty = "0.25.5"
mime = "0.3.18"
notify = "8.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
symphonia = { version = "0.6.1", features = ["all"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
