# Production: runs the image built by GitHub Actions (see .github/workflows/ci-cd.yml).
# Local build instead: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  qodi-music:
    image: ghcr.io/cbranty/qodi-music:${QODI_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    user: "${QODI_UID:-1000}:${QODI_GID:-1000}"
    environment:
      QODI_ADMIN_USER: ${QODI_ADMIN_USER:?set QODI_ADMIN_USER in .env}
      QODI_ADMIN_PASSWORD: ${QODI_ADMIN_PASSWORD:?set QODI_ADMIN_PASSWORD in .env}
      QODI_JWT_SECRET: ${QODI_JWT_SECRET:-}
      QODI_SCAN_INTERVAL_SECS: ${QODI_SCAN_INTERVAL_SECS:-3600}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ${QODI_MUSIC_DIR:-./music}:/music:ro
      - qodi-data:/data
    ports:
      - "${QODI_PORT:-4040}:4040"

volumes:
  qodi-data:
